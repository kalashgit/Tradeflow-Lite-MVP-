<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#152c42"><meta name="description" content="TradeFlow Lite offline customer, quote and job manager"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><title>TradeFlow Lite</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./phase1.css"><link rel="stylesheet" href="./ai-preview.css"><link rel="stylesheet" href="./growth.css"><link rel="stylesheet" href="./notifications.css"><link rel="stylesheet" href="./calendar.css?v=calendar-park-r16"><link rel="stylesheet" href="./job-forms.css"><link rel="stylesheet" href="./revenue.css?v=job-cost-v2-r01"><link rel="stylesheet" href="./marketing.css"><link rel="stylesheet" href="./research-briefs.css"><link rel="stylesheet" href="./routes.css"><link rel="stylesheet" href="./operations.css"><link rel="stylesheet" href="./opportunities-v5.css"><link rel="stylesheet" href="./unified-header.css?v=command-header-r05"><link rel="stylesheet" href="./appearance-theme.css"><link rel="stylesheet" href="./opportunity-dossier.css"><link rel="stylesheet" href="./suppliers.css?v=supply-v2-r02"><link rel="stylesheet" href="./map-experience.css?v=map-sheet-m05"></head><body><div id="app"></div><script src="./growth.js"></script><script src="./notifications.js"></script><script src="./schedule-engine.js?v=calendar-r06"></script><script src="./calendar.js?v=calendar-park-r16"></script><script src="./job-forms.js"></script><script src="./revenue.js?v=job-cost-v2-r02"></script><script src="./marketing.js"></script><script src="./research-briefs.js"></script><script src="./routes.js"></script><script src="./operations.js"></script><script src="./opportunities-v5.js"></script><script src="./tradeflow-engine.js"></script><script src="./appearance-theme.js /* Installed-app touch behavior: preserve map gestures and editable fields. */
(function(){
 const editable=t=>!!t?.closest?.('input,textarea,select,[contenteditable="true"],[role="textbox"]');
 const onMap=t=>!!t?.closest?.('.territory-map,.maplibregl-canvas-container,.maplibregl-canvas');
 document.addEventListener('gesturestart',e=>{if(!onMap(e.target)&&!editable(e.target))e.preventDefault()},{passive:false});
 document.addEventListener('gesturechange',e=>{if(!onMap(e.target)&&!editable(e.target))e.preventDefault()},{passive:false});
 document.addEventListener('dblclick',e=>{if(!onMap(e.target)&&!editable(e.target))e.preventDefault()},{passive:false});
 document.addEventListener('selectstart',e=>{if(!editable(e.target)&&!e.target?.closest?.('.tf-allow-selection'))e.preventDefault()});
})();
</script></body></html>
