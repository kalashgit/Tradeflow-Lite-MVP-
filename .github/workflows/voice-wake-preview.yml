name: TradeFlow Isolated Voice Wake Preview

on:
  push:
    branches:
      - codex/voice-wake-orb
    paths:
      - .github/workflows/voice-wake-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradeflow-isolated-voice-wake-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: tradeflow-preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Verify wake branch and behavior
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/voice-wake-orb'
          node --check public/voice-command.js
          node --check public/ai-speech.js
          npm test
          npm run test:storage
          npm run test:contractors
      - name: Build isolated preview configuration
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(config.name!=='tradeflow-v05-preview'||config.assets?.directory!=='./public'||config.ai?.binding!=='AI')throw Error('Unexpected source configuration');
          config.name='tradeflow-wake-private-preview';
          config.d1_databases=[]; // This preview cannot read or mutate the pilot database.
          config.vars={...config.vars,TF_AURA_TTS_ENABLED:'true',TF_EXTENDED_RECORDS_ENABLED:'false'};
          fs.writeFileSync('wrangler.voice-preview.jsonc',JSON.stringify(config,null,2));
          NODE
      - name: Deploy isolated Worker and app assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.voice-preview.jsonc
      - name: Verify deployed app and AI speech route
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const root='https://tradeflow-wake-private-preview.bartoszszarafinski.workers.dev';
          (async()=>{
            let ok=false;
            for(let i=0;i<12;i++){
              try{
                const [page,voice,app,health]=await Promise.all([
                  fetch(root+'/?v='+Date.now(),{signal:AbortSignal.timeout(12000)}),
                  fetch(root+'/voice-command.js?v='+Date.now(),{signal:AbortSignal.timeout(12000)}),
                  fetch(root+'/app.js?v='+Date.now(),{signal:AbortSignal.timeout(12000)}),
                  fetch(root+'/api/ai/health',{signal:AbortSignal.timeout(12000)})
                ]);
                assert.equal(page.status,200);assert.equal(voice.status,200);assert.equal(app.status,200);assert.equal(health.status,200);
                assert.match(await voice.text(),/enableWake/);
                assert.match(await app.text(),/TradeFlowVoiceGreeting/);
                const status=await health.json();assert.equal(status.aiBound,true);
                ok=true;break;
              }catch(e){if(i===11)throw e;await new Promise(r=>setTimeout(r,3500))}
            }
            assert.ok(ok);console.log('Isolated voice preview assets and AI binding verified. No database binding.');
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
