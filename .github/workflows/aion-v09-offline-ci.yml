name: AION Genesis — Offline Strategy Research Gates

on:
  push:
    branches:
      - research/aion-v06-qwen-bridge
    paths:
      - 'research/aion-v06/**'
      - 'CLAUDE.md'
      - 'docs/AION_CLAUDE_EXECUTION_PLAYBOOK.md'
      - 'docs/CLAUDE_TASK_PACKET.md'
      - '.github/workflows/aion-v09-offline-ci.yml'
  pull_request:
    paths:
      - 'research/aion-v06/**'
      - 'CLAUDE.md'
      - 'docs/AION_CLAUDE_EXECUTION_PLAYBOOK.md'
      - 'docs/CLAUDE_TASK_PACKET.md'
      - '.github/workflows/aion-v09-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aion-v09-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-research:
    name: Synthetic strategy verification (no model or secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: research/aion-v06
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and research contract tests
        run: python -m unittest discover -s tests -q
      - name: Run prospective v1.2 contextual memory comparison (dev + validation only)
        run: >-
          python -m aion_genesis.lab run
          --config aion_genesis/lab/configs/genesis_v12_contextual_eval.json
          --partitions dev validation
          --out "${{ runner.temp }}/aion-genesis-v12"
      - name: Independently replay prospective experimental ledger
        run: >-
          python -m aion_genesis.lab validate
          --out "${{ runner.temp }}/aion-genesis-v12"
          --reproduce
      - name: Disclose family-level v1.2 comparisons and holdout status
        env:
          AION_V12_REPORT: ${{ runner.temp }}/aion-genesis-v12
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["AION_V12_REPORT"])
          entry = json.loads((root / "index.jsonl").read_text().splitlines()[-1])
          report = json.loads((root / "runs" / entry["run_id"] / "result.json").read_text())
          validation = json.loads((root / "runs" / entry["run_id"] / "validation.json").read_text())
          assert set(report["partitions"]) == {"dev", "validation"}
          assert report["status"] == "completed"
          assert report["verdict"] == "INCONCLUSIVE"
          assert report["config"]["candidate"] == "aion_v12_contextual"
          assert report["config"]["baseline"] == "aion_v1_memory"
          assert report["config"]["memory_off_control"] == "v09_strategist"
          assert report["labels"]["model_inference_calls"] == 0
          assert report["labels"]["external_actions"] == 0
          assert validation["valid"] and validation["reproduced"]
          for partition, body in report["partitions"].items():
              score = body["scorecard"]
              pooled = score["comparisons"]["candidate_vs_baseline"]["pooled"]["shifted"]
              delta = pooled["harmful_choice_rate_delta"]
              print(partition, "contextual_vs_v1", delta)
              for family in report["config"]["families"]:
                  by_policy = score["decision_quality"][family]["shifted"]
                  print(partition, family, {
                      policy: by_policy[policy]["harmful_choice"]
                      for policy in ("aion_v12_contextual", "aion_v1_memory", "v09_strategist")})
          print("Protected holdout deliberately not evaluated; no promotion claim.")
          PY
      - name: Store v1.2 prospective research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aion-v12-contextual-${{ github.run_id }}
          path: ${{ runner.temp }}/aion-genesis-v12/runs/
          retention-days: 14
      - name: Run prospective v1.2.1 hybrid memory comparison (new dev + validation)
        run: >-
          python -m aion_genesis.lab run
          --config aion_genesis/lab/configs/genesis_v121_hybrid_eval.json
          --partitions dev validation
          --out "${{ runner.temp }}/aion-genesis-v121"
      - name: Reproduce v1.2.1 hybrid ledger independently
        run: >-
          python -m aion_genesis.lab validate
          --out "${{ runner.temp }}/aion-genesis-v121"
          --reproduce
      - name: Show hybrid vs legacy memory and each family result
        env:
          AION_HYBRID_REPORT: ${{ runner.temp }}/aion-genesis-v121
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["AION_HYBRID_REPORT"])
          index = json.loads(root.joinpath("index.jsonl").read_text().splitlines()[-1])
          folder = root / "runs" / index["run_id"]
          report = json.loads((folder / "result.json").read_text())
          verified = json.loads((folder / "validation.json").read_text())
          assert verified["valid"] and verified["reproduced"]
          assert set(report["partitions"]) == {"dev", "validation"}
          assert report["verdict"] == "INCONCLUSIVE"
          assert report["config"]["candidate"] == "aion_v12_hybrid"
          assert report["config"]["baseline"] == "aion_v1_memory"
          assert report["labels"]["model_inference_calls"] == 0
          assert report["labels"]["external_actions"] == 0
          for part, block in report["partitions"].items():
              card = block["scorecard"]
              pooled = card["comparisons"]["candidate_vs_baseline"]["pooled"]["shifted"]
              print(part, "hybrid_vs_legacy", pooled["harmful_choice_rate_delta"])
              for family in report["config"]["families"]:
                  by = card["decision_quality"][family]["shifted"]
                  print(part, family, {
                      p: by[p]["harmful_choice"] for p in (
                          "aion_v12_hybrid", "aion_v1_memory", "aion_v12_contextual",
                          "v09_strategist")})
          print("Unseen holdout left unrun; no promotion.")
          PY
      - name: Archive independent hybrid dev and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: aion-v121-hybrid-${{ github.run_id }}
          path: ${{ runner.temp }}/aion-genesis-v121/runs/
          retention-days: 14
      - name: Diagnose memory influence on predeclared resource-allocation dev cohort
        run: >-
          python -m aion_genesis.lab.memory_effects
          --partition dev
          --output "${{ runner.temp }}/genesis-v122-memory-effects-dev.json"
      - name: Diagnose memory influence on disjoint resource-allocation validation cohort
        run: >-
          python -m aion_genesis.lab.memory_effects
          --partition validation
          --output "${{ runner.temp }}/genesis-v122-memory-effects-validation.json"
      - name: Check diagnostic contracts and publish honest failure figures
        env:
          EFFECT_DIR: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EFFECT_DIR"])
          for part, seeds, episodes in (("dev", [270000, 270008], 8),
                                        ("validation", [280000, 280016], 16)):
              data = json.loads((root / f"genesis-v122-memory-effects-{part}.json").read_text())
              assert data["schema"] == "GenesisMemoryEffectDiagnostics/1.0"
              assert data["partition"] == part and data["seed_range"] == seeds
              assert not data["protected_holdout_evaluated"]
              assert not data["hidden_truth_exposed_to_policy"]
              assert not data["policy_actions_modified_by_instrumentation"]
              assert not data["real_world_improvement_proven"]
              assert len(data["cases"]) == episodes * 2 * 6 * 4
              for variant in ("nominal", "shifted"):
                  print(f"--- {part} {variant} resource allocation ---")
                  for policy in data["policies"]:
                      s = data["comparisons"][f"{variant}/{policy}"]
                      print(policy, "harm", s["harmful_choice"],
                            "memory_present", s["memory_version_present"],
                            "changed_estimates", s["memory_changed_any_estimate"],
                            "score_leader_flips", s["memory_changed_score_leader"],
                            "retrieval_stages", s["retrieval_stage_counts"],
                            "changed_actions_vs_off", s["different_actions_than_memory_off"],
                            "better/worse/equal", (s["divergence_realized_better"],
                            s["divergence_realized_worse"],
                            s["divergence_realized_equal"]))
                  print("v1 public-context groups:",
                        data["comparisons"][f"{variant}/aion_v1_memory"]["public_condition_harm"])
          print("Diagnostic-only: unchanged referee, protected holdout not evaluated.")
          PY
      - name: Archive research-only memory influence evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v122-memory-effects-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/genesis-v122-memory-effects-dev.json
            ${{ runner.temp }}/genesis-v122-memory-effects-validation.json
          retention-days: 14
      - name: Evaluate new v1.2.3 relevant-recall policy on sealed prospective dev and validation
        run: >-
          python -m aion_genesis.lab run
          --config aion_genesis/lab/configs/genesis_v123_relevance_eval.json
          --partitions dev validation
          --out "${{ runner.temp }}/aion-genesis-v123"
      - name: Independently reproduce new v1.2.3 policy results
        run: >-
          python -m aion_genesis.lab validate
          --out "${{ runner.temp }}/aion-genesis-v123"
          --reproduce
      - name: Observe relevant memory on resource allocation dev
        run: >-
          python -m aion_genesis.lab.relevant_diagnostics
          --partition dev --out "${{ runner.temp }}/v123-relevant-dev.json"
      - name: Observe relevant memory on disjoint resource allocation validation
        run: >-
          python -m aion_genesis.lab.relevant_diagnostics
          --partition validation --out "${{ runner.temp }}/v123-relevant-validation.json"
      - name: Enforce verified recall, audit trail and independent scoring boundaries
        env:
          EVAL_ROOT: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVAL_ROOT"])
          data = root / "aion-genesis-v123"
          index = json.loads((data / "index.jsonl").read_text().splitlines()[-1])
          folder = data / "runs" / index["run_id"]
          result = json.loads((folder / "result.json").read_text())
          validation = json.loads((folder / "validation.json").read_text())
          assert validation["valid"] and validation["reproduced"]
          assert set(result["partitions"]) == {"dev", "validation"}
          assert result["verdict"] == "INCONCLUSIVE"
          assert result["config"]["candidate"] == "aion_v123_relevant"
          assert result["config"]["baseline"] == "aion_v1_memory"
          assert result["labels"]["model_inference_calls"] == 0
          assert result["labels"]["external_actions"] == 0
          for part in ("dev", "validation"):
              diag = json.loads((root / f"v123-relevant-{part}.json").read_text())
              assert diag["schema"] == "GenesisRelevantRecallDiagnostics/1.0"
              assert diag["partition"] == part
              assert not diag["protected_holdout_evaluated"]
              assert not diag["policy_actions_modified_by_instrumentation"]
              assert not diag["hidden_truth_exposed_to_policy"]
              assert not diag["real_world_improvement_proven"]
              expected = {"dev": [330000, 330008],
                          "validation": [340000, 340016]}[part]
              assert diag["seed_range"] == expected
              print(part, "observed memory activity", diag["activity"])
              for variant in ("nominal", "shifted"):
                  print(part, variant, "resource allocation:")
                  for policy in diag["policies"]:
                      stat = diag["comparison"][f"{variant}/{policy}"]
                      print(" ", policy, "harm", stat["harmful_choice"],
                            "leader_flips", stat["memory_changed_score_leader"],
                            "action_divergence", stat["different_actions_than_memory_off"],
                            "regret", stat["mean_regret"])
                  pooled = result["partitions"][part]["scorecard"][
                      "comparisons"]["candidate_vs_baseline"]["pooled"][variant][
                      "harmful_choice_rate_delta"]
                  print(part, variant, "all-family pooled comparison", pooled)
          dev = json.loads((root / "v123-relevant-dev.json").read_text())
          assert any(v["supported_option_occurrences"] > 0
                     for v in dev["activity"].values()), "No relevant recalls on development scenarios"
          assert any(v["applied_estimate_corrections"] > 0
                     for v in dev["activity"].values()), "No applied memory on development scenarios"
          print("Non-holdout diagnostic complete. No promotion or deployment.")
          PY
      - name: Archive prospective v1.2.3 research evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v123-relevance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aion-genesis-v123/runs/
            ${{ runner.temp }}/v123-relevant-dev.json
            ${{ runner.temp }}/v123-relevant-validation.json
          retention-days: 14
      - name: Evaluate v1.2.4 domain-general memory on fresh dev and validation seeds
        run: >-
          python -m aion_genesis.lab run
          --config aion_genesis/lab/configs/genesis_v124_domain_general_eval.json
          --partitions dev validation
          --out "${{ runner.temp }}/aion-genesis-v124"
      - name: Independently reproduce v1.2.4 matched comparisons
        run: >-
          python -m aion_genesis.lab validate
          --out "${{ runner.temp }}/aion-genesis-v124"
          --reproduce
      - name: Build independent laboratory multi-metric review from replayed ledger
        env:
          LAB_OUT: ${{ runner.temp }}/aion-genesis-v124
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from aion_genesis.lab.review_fabric import (
              build_review, render_markdown,
          )
          from aion_genesis.lab.ledger import read_ledger

          output = Path(os.environ["LAB_OUT"])
          entry = json.loads((output / "index.jsonl").read_text().splitlines()[-1])
          run_dir = output / "runs" / entry["run_id"]
          result = json.loads((run_dir / "result.json").read_text())
          validation = json.loads((run_dir / "validation.json").read_text())
          review = build_review(result, read_ledger(run_dir / "ledger.jsonl"), validation)
          (run_dir / "lab-review.json").write_text(
              json.dumps(review, sort_keys=True, indent=2) + "\\n")
          (run_dir / "lab-review.md").write_text(render_markdown(review))
          assert review["protected_holdout_not_examined"]
          assert review["replay_verified"]
          assert review["promotion"] == "never_auto_promote"
          print(render_markdown(review))
          print("Lab foundation: failed experimental candidates remain valid records; "
                "this review does not change judging or grant promotion.")
          PY
      - name: Diagnose v1.2.4 resource allocation memory activity on dev
        run: >-
          python -m aion_genesis.lab.domain_general_diagnostics
          --partition dev --out "${{ runner.temp }}/v124-domain-dev.json"
      - name: Diagnose v1.2.4 resource allocation memory activity on validation
        run: >-
          python -m aion_genesis.lab.domain_general_diagnostics
          --partition validation --out "${{ runner.temp }}/v124-domain-validation.json"
      - name: Verify v1.2.4 scientific boundaries and print full family outcomes
        env:
          ROOT: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          folder = root / "aion-genesis-v124"
          record = json.loads((folder / "index.jsonl").read_text().splitlines()[-1])
          run = folder / "runs" / record["run_id"]
          result = json.loads((run / "result.json").read_text())
          check = json.loads((run / "validation.json").read_text())
          assert check["valid"] and check["reproduced"]
          assert set(result["partitions"]) == {"dev", "validation"}
          assert result["verdict"] == "INCONCLUSIVE"
          assert result["config"]["candidate"] == "aion_v124_domain_relevant"
          assert result["config"]["baseline"] == "aion_v1_memory"
          assert result["labels"]["model_inference_calls"] == 0
          assert result["labels"]["external_actions"] == 0
          for part, start, episodes in (("dev", 390000, 8),
                                        ("validation", 400000, 16)):
              diag = json.loads((root / f"v124-domain-{part}.json").read_text())
              assert diag["schema"] == "GenesisDomainGeneralRecallDiagnostics/1.0"
              assert diag["seed_range"] == [start, start + episodes]
              assert not diag["protected_holdout_evaluated"]
              assert not diag["hidden_truth_exposed_to_policy"]
              assert not diag["policy_actions_modified_by_instrumentation"]
              print(part, "v124 memory activity", diag["activity"])
              sc = result["partitions"][part]["scorecard"]
              for variant in ("nominal", "shifted"):
                  print(part, variant, "pooled shifted harm candidate vs v1",
                        sc["comparisons"]["candidate_vs_baseline"][
                            "pooled"][variant]["harmful_choice_rate_delta"])
                  for family in result["config"]["families"]:
                      policy = sc["decision_quality"][family][variant]
                      print(part, variant, family, {
                          name: {"harm": policy[name]["harmful_choice"],
                                 "utility": policy[name]["mean_episode_utility"],
                                 "regret": policy[name][
                                     "mean_episode_regret_to_hindsight_oracle"],
                                 "worst_decile": policy[name][
                                     "worst_decile_mean_delta_vs_no_action"]}
                          for name in ("v09_strategist", "aion_v1_memory",
                                       "aion_v123_relevant",
                                       "aion_v124_domain_relevant")})
          dev = json.loads((root / "v124-domain-dev.json").read_text())
          assert any(x["supported_option_occurrences"] > 0
                     for x in dev["activity"].values()), "No real supported retrieval in dev"
          print("Holdout NOT evaluated. No automatic promotion.")
          PY
      - name: Archive v1.2.4 scorecards and passive memory traces
        uses: actions/upload-artifact@v4
        with:
          name: genesis-v124-domain-general-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aion-genesis-v124/runs/
            ${{ runner.temp }}/v124-domain-dev.json
            ${{ runner.temp }}/v124-domain-validation.json
          retention-days: 14
      - name: Grounded situation to strategic option plan
        run: >-
          python -m aion_genesis.strategic_cli plan
          --output "${{ runner.temp }}/aion-v09-plan.json"
      - name: Independent nominal 200-world benchmark
        run: >-
          python -m aion_genesis.strategic_cli benchmark --worlds 200 --seed 8000
          --output "${{ runner.temp }}/aion-v09-nominal.json"
      - name: Shifted-world failure disclosure
        run: >-
          python -m aion_genesis.strategic_cli benchmark --worlds 200 --seed 8000
          --regime unexpected_failure
          --output "${{ runner.temp }}/aion-v09-shifted.json"
      - name: Enforce research-only evidence boundary
        env:
          AION_REPORT_DIR: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          base = Path(os.environ['AION_REPORT_DIR'])
          plan = json.loads((base / 'aion-v09-plan.json').read_text())
          assert plan['case_source'] == 'v0.8_current_situation_observations'
          assert plan['automatic_decisions_executed'] == 0
          assert plan['selected']['approval_state'] == 'pending_human_review'
          assert not plan['learned_policy_verified']
          assert not plan['all_real_world_options_known']
          for regime, name in [('nominal', 'nominal'),
                               ('unexpected_failure', 'shifted')]:
              result = json.loads((base / f'aion-v09-{name}.json').read_text())
              assert result['hidden_regime'] == regime
              assert result['worlds'] == 200
              assert result['model_inference_calls'] == 0
              assert not result['autonomous_learning_proven']
              assert not result['real_world_improvement_proven']
              print(name, 'harm_fraction=', result['fraction_planner_worse_than_baseline'])
          PY
      - name: Store synthetic-only reports
        uses: actions/upload-artifact@v4
        with:
          name: aion-v09-offline-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aion-v09-plan.json
            ${{ runner.temp }}/aion-v09-nominal.json
            ${{ runner.temp }}/aion-v09-shifted.json
          retention-days: 14
      - name: Explicit evidence disclaimer
        run: |
          echo "AION v0.9 synthetic-only research; no real model inference or business actions." >> "$GITHUB_STEP_SUMMARY"
          echo "Exact commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  mock-workflow-v2:
    name: Fast mock tool-workflow evaluation (no live connectors)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/aion-v06
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Workflow v2 regression suite only
        run: python -m unittest discover -s tests -p test_eval_v2_mock_workflow.py -q
      - name: Run fictional workflow lab v2 on development cases only
        run: >-
          python -m aion_genesis.eval_v2 run
          --suite dev --out "${{ runner.temp }}/genesis-eval-v2-dev"
      - name: Reproduce v2 workflows and inspect human packet boundary
        run: |
          python -m aion_genesis.eval_v2 verify --out "${{ runner.temp }}/genesis-eval-v2-dev"
          python -m aion_genesis.eval_v2 packet \
            --run-dir "${{ runner.temp }}/genesis-eval-v2-dev" \
            --out "${{ runner.temp }}/genesis-eval-v2-dev/reviewer-packet.json" \
            --limit 12 --reviewer-id "reviewer_template_only"
          python - <<'PY'
          import json
          from pathlib import Path
          import os

          root = Path(os.environ["RUNNER_TEMP"]) / "genesis-eval-v2-dev"
          report = json.loads((root / "result.json").read_text())
          packet = json.loads((root / "reviewer-packet.json").read_text())
          assert report["protected_holdout_evaluated"] is False
          assert report["promotion"] == "blocked_without_independent_review"
          assert report["external_business_actions"] == 0
          assert report["real_world_quality_proven"] is False
          assert packet["human_labels_supplied"] is False
          assert packet["source_suite"] == "dev"
          print("V2 synthetic mock-workflow evidence verified. No real humans rated.")
          PY
      - name: Verify synthetic fault-combination recovery matrix
        run: >-
          python -m aion_genesis.eval_v2.mutation
          --out "${{ runner.temp }}/genesis-eval-v2-dev/fault-matrix.json"
      - name: Run portfolio resource-allocation contract tests
        run: python -m unittest discover -s tests -p test_eval_v21_portfolio.py -q
      - name: Run new fictional portfolio laboratory on dev only
        run: >-
          python -m aion_genesis.eval_v2.portfolio_runner run
          --suite dev --out "${{ runner.temp }}/genesis-portfolio-v21-dev"
      - name: Independently verify portfolio trace and report
        run: |
          python -m aion_genesis.eval_v2.portfolio_runner verify \
            --out "${{ runner.temp }}/genesis-portfolio-v21-dev"
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          path = Path(os.environ["RUNNER_TEMP"]) / "genesis-portfolio-v21-dev"
          data = json.loads((path / "result.json").read_text())
          assert data["suite"] == "dev"
          assert not data["protected_holdout_evaluated"]
          assert data["promotion"] == "not_authorized"
          assert data["autonomous_business_actions"] == 0
          assert data["policy_names"] == [
              "no_action", "deadline_first", "cash_aware"]
          assert data["scorecards"]["no_action"]["verified_jobs"] == 0
          assert data["scorecards"]["no_action"]["missed_opportunity_proxy_total"] > 0
          for name, metrics in data["scorecards"].items():
              print(name, metrics)
          print("No real tools, no holdout, no performance promotion.")
          PY
      - name: Archive fictional portfolio evidence separately
        uses: actions/upload-artifact@v4
        with:
          name: genesis-portfolio-v21-dev-${{ github.run_id }}
          path: ${{ runner.temp }}/genesis-portfolio-v21-dev/
          retention-days: 14
      - name: Preserve workflow lab v2 public-dev evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis-eval-v2-dev-${{ github.run_id }}
          path: ${{ runner.temp }}/genesis-eval-v2-dev/
          retention-days: 14

  business-network-factory-v22:
    name: Fast multi-stakeholder scenario generation and replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/aion-v06
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scenario factory privacy, provenance and revision tests
        run: python -m unittest discover -s tests -p test_eval_v22_business_network.py -q
      - name: Generate 120 fictional multi-stakeholder scenarios
        run: >-
          python -m aion_genesis.eval_v2.network_runner run
          --split dev --count 120 --out "${{ runner.temp }}/genesis-network-v22-dev"
      - name: Independently regenerate and validate complete event ledger
        run: |
          python -m aion_genesis.eval_v2.network_runner verify \
            --out "${{ runner.temp }}/genesis-network-v22-dev"
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          from aion_genesis.eval_v2.network_factory import ROLES, WORKFLOWS, DISRUPTIONS

          root = Path(os.environ["RUNNER_TEMP"]) / "genesis-network-v22-dev"
          report = json.loads((root / "result.json").read_text())
          assert report["split"] == "dev"
          assert report["different_scenarios"] == 120
          assert set(report["stakeholder_receipt_coverage"]) == set(ROLES)
          assert set(report["workflow_coverage"]) == set(WORKFLOWS)
          assert set(report["disruption_coverage"]) == set(DISRUPTIONS)
          assert report["protected_holdout_evaluated"] is False
          assert report["real_business_records_used"] is False
          assert report["policy_decision_improvement_proven"] is False
          assert report["promotion"] == "not_authorized"
          print("Business-network factory: roles", len(ROLES),
                "workflows", len(WORKFLOWS), "disruptions", len(DISRUPTIONS),
                "messages", report["routed_deliveries"])
          PY
      - name: Archive synthetic scenario-network evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis-business-network-v22-${{ github.run_id }}
          path: ${{ runner.temp }}/genesis-network-v22-dev/
          retention-days: 14

  causal-adaptive-curriculum-v23:
    name: Fast causal economics and adaptive curriculum replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/aion-v06
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Causal economics and adaptive learning safety contracts
        run: python -m unittest discover -s tests -p test_eval_v23_causal_curriculum.py -q
      - name: Generate causal development lessons and freeze selected policy
        run: >-
          python -m aion_genesis.eval_v2.adaptive_runner run
          --train 24 --validation 18
          --out "${{ runner.temp }}/genesis-causal-curriculum-v23"
      - name: Independently replay adaptive lessons and heldout exclusion
        run: |
          python -m aion_genesis.eval_v2.adaptive_runner verify \
            --out "${{ runner.temp }}/genesis-causal-curriculum-v23"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "genesis-causal-curriculum-v23"
          report = json.loads((root / "result.json").read_text())
          assert report["development_cases"] == 24
          assert report["public_validation_cases"] == 18
          assert report["validation_used_for_learning"] is False
          assert report["secured_holdout_evaluated"] is False
          assert report["llm_critic_used_to_score_or_promote"] is False
          assert report["candidate_code_modified"] is False
          assert report["production_actions"] == 0
          assert report["promotion"] == "blocked_pending_external_review"
          assert len(report["paired_synthetic_interventions"]) > 0
          print("V2.3 causal curriculum:", report["summary"])
          print("No model inference, production actions, or holdout access.")
          PY
      - name: Archive synthetic adaptive curriculum learning evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis-causal-curriculum-v23-${{ github.run_id }}
          path: ${{ runner.temp }}/genesis-causal-curriculum-v23/
          retention-days: 14
