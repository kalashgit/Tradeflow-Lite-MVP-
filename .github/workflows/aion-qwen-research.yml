name: AION — Real Qwen Research Benchmark

on:
  pull_request:
    paths:
      - 'research/aion/**'
      - '.github/workflows/aion-qwen-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aion-qwen:
    name: Isolated CPU ${{ matrix.model }} evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: qwen3:0.6b
            artifact: aion-qwen-0p6b
          - model: qwen3:1.7b
            artifact: aion-qwen-1p7b
    env:
      AION_MODEL_RUNTIME: ollama
      AION_MODEL_URL: http://127.0.0.1:11434
      AION_MODEL_ID: ${{ matrix.model }}
      OLLAMA_HOST: 127.0.0.1:11434
    defaults:
      run:
        working-directory: research/aion
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify research package tests
        run: npm test
      - name: Verify deterministic control (not model inference)
        run: npm run benchmark:oracle
      - name: Install isolated Ollama runner
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh -o /tmp/aion-ollama-install.sh
          sh /tmp/aion-ollama-install.sh
      - name: Start private model server and download ${{ matrix.model }}
        run: |
          ollama serve > /tmp/aion-ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version
          ollama pull "$AION_MODEL_ID"
          ollama list
      - name: Live Qwen readiness and actual inference
        run: npm run probe
      - name: Raw Qwen hypothesis baseline (record gate failures)
        run: |
          set +e
          AION_REPAIR_MODE=none node bin/aion.cjs benchmark --provider qwen > aion-qwen-raw.json
          status=$?
          set -e
          echo "Unassisted Qwen benchmark exit status: $status (2 = metric gate not reached)."
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
      - name: Verified Qwen hypothesis repair with observed counterexamples
        run: AION_REPAIR_MODE=feedback node bin/aion.cjs benchmark --provider qwen > aion-qwen-repair.json
      - name: Upload synthetic research benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            research/aion/aion-qwen-raw.json
            research/aion/aion-qwen-repair.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Write concise gate status
        if: always()
        run: |
          echo "AION research-only pipeline (no production deploy, no customer data, no model training)." >> "$GITHUB_STEP_SUMMARY"
          echo "Exact commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Model: $AION_MODEL_ID via temporary CPU Ollama runner." >> "$GITHUB_STEP_SUMMARY"
          echo "No causal memory is created or persisted by this workflow." >> "$GITHUB_STEP_SUMMARY"
          for file in aion-qwen-raw.json aion-qwen-repair.json; do
            if [ -s "$file" ]; then
              node -e 'const f=require("./"+process.argv[1]);const s=f.summary;console.log(process.argv[1]+": live="+s.realModelInference+", accuracy="+s.meanTruthTableAccuracy+", consistency="+s.hypothesisConsistencyRate+", revisions="+s.revisionCount+", model calls="+s.modelCalls+", repair attempts="+s.repairAttempts);' "$file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
