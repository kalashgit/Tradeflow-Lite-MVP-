name: TradeFlow Home Master Style Live Preview
# Founder-approved curved T / TRADE-FLOW logo and Home master visual system; retain the living orb.
on:
  push:
    branches: [feature/tf-orb-live-integration-20261106]
    paths: [.github/workflows/orb-live-preview.yml]
permissions:
  contents: read
concurrency:
  group: tradeflow-library-pilot-preview
  cancel-in-progress: false
jobs:
  discovery-regression:
    runs-on: ubuntu-latest
    env:
      TRADEFLOW_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Confirm exact head and initialize evidence
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain)"
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/exact-head-sha.txt
          node --version | tee artifacts/node-version.txt
      - name: Syntax checks
        run: |
          node --check src/tenant-api.js
          node --check src/intelligence-context.js
          node --check public/cloud-intelligence.js
          node --check public/intelligence-evidence.js
          node --check public/master-intelligence.js
          node --check public/presentation-motion.js
          node --check scripts/verify-motion-integration.cjs
          node --check public/host-presentation.js
          node --check public/host-lifecycle.js
          node --check scripts/verify-host-presentation.cjs
          node --check public/adaptive-ui.js
          node --check scripts/verify-adaptive-ui.cjs
          node --check public/command-center.js
          node --check scripts/verify-command-center.cjs
          node --check public/decision-ui.js
          node --check scripts/verify-decision-journey.cjs
          node --check scripts/verify-intelligence-context.cjs
          node --check scripts/verify-d1-advisory-local.cjs
          node --check scripts/verify-d1-migrations-local.cjs
          node --check scripts/verify-d1-restore-local.cjs
          node --check scripts/verify-proactive-labor.cjs
          node --check scripts/verify-two-device-sync.cjs
          node --check public/sync-queue.js
          node --check tests/sync-intent-status.test.cjs
          node --check public/record-model.js
          node --check public/offline-conflicts.js
          node --check tests/record-identity-contract.test.cjs
          node --check public/cloud-retrieval.js
          node --check public/migration-ui.js
          node --check public/migration-preview.js
          node --check public/core-integration.js
          node --check public/command-registry.js
          node --check scripts/verify-command-cross-tab.cjs
          node --check scripts/summarize-ci-evidence.cjs
          node --check tests/ci-evidence-summary.test.cjs
          node --check tests/command-hardening-adversarial.test.cjs
          node --check tests/helpers/local-db.cjs
          node --check public/operational-intelligence.js
          node --check public/change-orders.js
          node --check public/app.js
          node --check tests/change-order-review-execution.test.cjs
          node --check tests/job-cost-review-execution.test.cjs
          node --check tests/quotation-followup-execution.test.cjs
          node --check tests/quotation-legacy-followup-policy.test.cjs
          node --check tests/quotation-contact-recording.test.cjs
          node --check tests/invoice-followup-execution.test.cjs
          node --check public/calendar.js
          node --check tests/calendar-conflict-resolution.test.cjs
          node --check tests/reviewed-transfer.test.cjs
          node --check tests/cloud-retrieval.test.cjs
          node --check tests/tenant-api.test.cjs
          node --check tests/sync-queue.test.cjs
      - name: Focused authorization and offline queue regression
        shell: bash
        run: |
          set -o pipefail
          node --test tests/master-intelligence.test.cjs tests/tenant-api.test.cjs tests/sync-queue.test.cjs tests/cloud-retrieval.test.cjs tests/reviewed-transfer.test.cjs tests/quotation-followup-execution.test.cjs tests/quotation-legacy-followup-policy.test.cjs tests/quotation-contact-recording.test.cjs tests/invoice-followup-execution.test.cjs tests/calendar-conflict-resolution.test.cjs 2>&1 | tee artifacts/focused-node.log
      - name: Full Node regression
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee artifacts/full-node.log
      - name: Storage migration regression
        shell: bash
        run: |
          set -o pipefail
          npm run test:storage 2>&1 | tee artifacts/storage.log
      - name: Contractor pain-point regression
        shell: bash
        run: |
          set -o pipefail
          npm run test:contractors 2>&1 | tee artifacts/contractor-regression.log
      - name: Browser prerequisites
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser regression
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee artifacts/browser.log
      - name: Synthetic mobile and desktop proactive labor workflow
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-proactive-labor.cjs 2>&1 | tee artifacts/proactive-labor-browser.log
      - name: Disposable local Wrangler D1 advisory acceptance
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-d1-advisory-local.cjs 2>&1 | tee artifacts/d1-local-advisory.log
      - name: Disposable local Wrangler D1 committed-migrations acceptance
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-d1-migrations-local.cjs 2>&1 | tee artifacts/d1-local-migrations.log
      - name: Disposable local Wrangler D1 logical restore drill
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-d1-restore-local.cjs 2>&1 | tee artifacts/d1-local-restore.log
      - name: Verify Home master style and canonical branding across screens
        run: |
          python3 -m http.server 8082 --bind 127.0.0.1 --directory public > /tmp/master-style-http.log 2>&1 &
          master_preview_pid=$!
          trap 'kill "$master_preview_pid" 2>/dev/null || true' EXIT
          node scripts/verify-master-style.cjs
      - name: Verify approved orb inside the actual app
        run: |
          if ! command -v ffmpeg; then sudo apt-get update; sudo apt-get install -y ffmpeg; fi
          node scripts/verify-intelligence-orb-idle.cjs
          python3 -m pip install Pillow numpy
          python3 scripts/report-concept-b-comparison.py
      - name: Summarize exact-head regression evidence
        run: node scripts/summarize-ci-evidence.cjs
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradeflow-cloud-review-verification
          path: |
            artifacts/
          if-no-files-found: warn

  deploy-preview:
    needs: discovery-regression
    if: github.ref == 'refs/heads/feature/tf-orb-live-integration-20261106' && contains(github.event.head_commit.message, '[preview-release]')
    runs-on: ubuntu-latest
    environment: tradeflow-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Enforce existing isolated preview configuration
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          assert.equal(c.name,'tradeflow-v05-preview');
          assert.equal(c.main,'./src/index.js');assert.equal(c.assets.directory,'./public');
          assert.equal(c.d1_databases.length,1);
          assert.equal(c.d1_databases[0].binding,'TF_DB');
          assert.equal(c.d1_databases[0].database_name,'tradeflow-pilot-isolated');
          assert.equal(c.d1_databases[0].database_id,'91eeef63-48d4-4925-a2f1-1a43b164754c');
          assert.equal(c.vars.TF_BACKUP_EXPORT_ENABLED,'false');
          assert.equal(c.vars.TF_BACKUP_DRY_RUN_ENABLED,'false');
          for(const k of ['routes','route','env','triggers','queues','workflows','durable_objects'])assert.ok(!c[k],k+' not allowed in this release');
          NODE
      - name: Reject concurrent GUI release or unrelated application changes
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const cp=require('node:child_process');
          (async()=>{
            const root='https://tradeflow-library-pilot-preview.bartoszszarafinski.workers.dev';
            const r=await fetch(root+'/release.json?orb-base='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200);const live=await r.json();
            assert.ok(['c5633a71f9ea745925fb00601b1c718b4ffd853c',process.env.GITHUB_SHA].includes(live.commit),'Live GUI changed while orb release was prepared');
            for(const [name,digest] of Object.entries(live.assets)){
              if(['index.html','sw.js','app.js','graphite-theme.css','master-style.css','manifest.webmanifest','icons/icon.svg'].includes(name)||name.startsWith('brand/'))continue;
              assert.equal(hash(fs.readFileSync('public/'+name)),digest,'Unrelated GUI asset changed: '+name);
            }
            const old=cp.execFileSync('git',['diff','3408c4036f183e0032f295c78a7a6da0cd9e0152','HEAD','--','src','wrangler.jsonc'],{encoding:'utf8'});
            assert.equal(old,'','Server and resource configuration must stay unchanged');
            console.log('Only approved branding/master-style assets differ from deployed GUI');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Record exact source and asset digests
        run: node automation/preview-release.cjs build
      - name: Deploy existing pilot Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.jsonc --name tradeflow-library-pilot-preview --keep-vars --tag orb-concept-b --message "$GITHUB_SHA"
      - name: Verify every live asset and exact release SHA
        run: node automation/preview-release.cjs verify https://tradeflow-library-pilot-preview.bartoszszarafinski.workers.dev
      - name: Verify unauthenticated business API remains denied
        run: |
          node - <<'NODE'
          (async()=>{const r=await fetch('https://tradeflow-library-pilot-preview.bartoszszarafinski.workers.dev/api/v1/me',{redirect:'manual',signal:AbortSignal.timeout(15000)});if(![302,303,307,401,403].includes(r.status))throw Error('Business API did not fail closed: '+r.status);console.log('Unauthenticated API denied: '+r.status)})().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
