name: TradeFlow Unified Voice Isolated Preview

on:
  push:
    branches:
      - codex/unified-voice-preview-20261107
      - codex/ai-welcome-orb-video-20261108
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradeflow-isolated-voice-wake-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: tradeflow-preview
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build deterministic 60-frame welcome orb media
        run: bash scripts/build-welcome-orb-media.sh
      - name: Verify packaged video and GIF
        run: |
          test -s public/assets/tradeflow_orb_smooth_60_frames.mp4
          test -s public/assets/tradeflow_orb_60_frames.gif
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames,r_frame_rate -of default=noprint_wrappers=1 public/assets/tradeflow_orb_smooth_60_frames.mp4
      - name: Upload generated orb media evidence
        uses: actions/upload-artifact@v4
        with:
          name: tradeflow-orb-video-60frames
          path: |
            public/assets/tradeflow_orb_smooth_60_frames.mp4
            public/assets/tradeflow_orb_60_frames.gif
          retention-days: 14
      - name: Verify unified GUI and wake code
        run: |
          node --check public/app.js
          node --check public/voice-command.js
          node --check public/ai-speech.js
          node --check src/aura-tts.js
          npm test
          npm run test:storage
          npm run test:contractors
      - name: Verify rendered Master Intelligence welcome
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-master-welcome-browser.cjs
      - name: Upload visual overlay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradeflow-master-visual-overlay
          path: artifacts/master-intelligence-welcome/
          if-no-files-found: warn
          retention-days: 14
      - name: Build isolated preview config
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(config.name!=='tradeflow-v05-preview'||config.assets?.directory!=='./public'||config.ai?.binding!=='AI')throw Error('Unexpected Worker configuration');
          if(!fs.readFileSync('public/index.html','utf8').includes('ai-speech.js?v=aura-unified-01'))throw Error('Unified AI speech script missing');
          if(!fs.readFileSync('public/app.js','utf8').includes('tf-master-welcome'))throw Error('Master Intelligence screen missing');
          config.name='tradeflow-wake-private-preview';
          config.d1_databases=[]; // No pilot or production business database access.
          config.vars={...config.vars,TF_AURA_TTS_ENABLED:'true',TF_EXTENDED_RECORDS_ENABLED:'false'};
          fs.writeFileSync('wrangler.unified-voice-preview.jsonc',JSON.stringify(config,null,2));
          NODE
      - name: Deploy isolated Worker (production untouched)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.unified-voice-preview.jsonc --keep-vars --message "$GITHUB_SHA"
      - name: Check actual live unified UI and speech route
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const root='https://tradeflow-wake-private-preview.bartoszszarafinski.workers.dev';
          (async()=>{
            for(let n=0;n<12;n++){
              try{
                const stamp=Date.now();
                const [page,app,voice,speech,health,unauthorized]=await Promise.all([
                  fetch(root+'/?check='+stamp,{signal:AbortSignal.timeout(12000)}),
                  fetch(root+'/app.js?check='+stamp,{signal:AbortSignal.timeout(12000)}),
                  fetch(root+'/voice-command.js?check='+stamp,{signal:AbortSignal.timeout(12000)}),
                  fetch(root+'/ai-speech.js?check='+stamp,{signal:AbortSignal.timeout(12000)}),
                  fetch(root+'/api/ai/health',{signal:AbortSignal.timeout(12000)}),
                  fetch(root+'/api/ai/speech',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:'invalid',text:'test',speaker:'orion'}),signal:AbortSignal.timeout(12000)})
                ]);
                for(const r of [page,app,voice,speech,health])assert.equal(r.status,200,r.url+' unavailable');
                assert.equal(unauthorized.status,401);
                assert.match(await page.text(),/ai-speech\.js\?v=aura-unified-01/);
                const appBody=await app.text();
                assert.match(appBody,/tf-master-welcome/);
                assert.match(appBody,/TradeFlowVoiceGreeting/);
                assert.match(await voice.text(),/enableWake/);
                assert.match(await speech.text(),/tf-master-message\.is-assistant/);
                assert.equal((await health.json()).aiBound,true);
                const media=await Promise.all([
                  fetch(root+'/assets/tradeflow_orb_smooth_60_frames.mp4?check='+stamp,{signal:AbortSignal.timeout(12000)}),
                  fetch(root+'/assets/tradeflow_orb_60_frames.gif?check='+stamp,{signal:AbortSignal.timeout(12000)})
                ]);
                for(const m of media)assert.equal(m.status,200,m.url+' media unavailable');
                assert.match(media[0].headers.get('content-type')||'',/video\/mp4/);
                assert.match(media[1].headers.get('content-type')||'',/image\/gif/);
                assert.match(appBody,/tradeflow_orb_smooth_60_frames\.mp4/);
                console.log('PASS: actual MP4 and GIF live, no pilot DB binding');
                console.log('Unified preview verified; speech protected; no D1 binding in deployment config.');
                return;
              }catch(error){if(n===11)throw error;await new Promise(r=>setTimeout(r,3500))}
            }
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
