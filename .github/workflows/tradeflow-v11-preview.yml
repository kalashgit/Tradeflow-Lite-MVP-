name: TradeFlow V0.11 Preview
on:
  push:
    branches:
      - feature/v10-commercial-foundation
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tradeflow-v11-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install
      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name tradeflow-v11-preview
      - name: Preview URL
        run: echo "Preview Worker deployed as tradeflow-v11-preview. Confirm the actual workers.dev URL in Cloudflare."
