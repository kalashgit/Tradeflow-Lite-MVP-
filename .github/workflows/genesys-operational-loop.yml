name: AION Genesys — operational loop (instruction → verified TradeFlow state)

on:
  push:
    branches:
      - claude/genesys-operational-loop-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesys-operational-loop-${{ github.ref }}
  cancel-in-progress: false  # real-model runs are slow; queue rather than discard measured evidence

jobs:
  verify:
    name: Unit, browser, baseline and execution-layer checks (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Genesys operator and affected TradeFlow executor tests
        run: node --test tests/genesys-operator.test.cjs tests/invoice-followup-execution.test.cjs
      - name: Full TradeFlow Node suite (known missing 60-frame orb MP4 is reported, not hidden)
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm test > artifacts/node-suite.log 2>&1
          code=$?
          grep -E "^# (tests|pass|fail)" artifacts/node-suite.log
          failing=$(grep -E "^not ok" artifacts/node-suite.log | grep -v "both real 60-frame media assets must be installed before shipping" || true)
          if [ -n "$failing" ]; then echo "$failing"; exit 1; fi
          echo "Node suite exit code $code; only the known orb-media release blocker may fail."
      - name: Academy intake tests
        working-directory: research/aion-v06
        run: python -m unittest discover -s tests -p test_genesys_operational_intake.py -v
      - name: Browser prerequisites
        run: npx playwright install --with-deps chromium
      - name: Real TradeFlow app in Chromium (IndexedDB, runtime, executor, approval dialog)
        run: node scripts/verify-genesys-operator-browser.cjs
      - name: Baseline (today's TradeFlow) and scripted execution-layer reference (NOT AI)
        run: |
          node scripts/run-genesys-operational-benchmark.cjs --mode=baseline --out=artifacts/genesys-baseline.json --failures=artifacts/genesys-baseline-failures.jsonl
          node scripts/run-genesys-operational-benchmark.cjs --mode=oracle --out=artifacts/genesys-oracle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesys-verify-${{ github.run_id }}
          path: artifacts
          retention-days: 30

  qwen:
    # Bounded CPU runs on free hosted runners: public weights, loopback-only model,
    # synthetic records, no secrets, no deployment.
    name: Real Qwen through the full loop (${{ matrix.model }}, CPU)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: ['qwen3:0.6b', 'qwen3:1.7b']
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install loopback Ollama
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh -o /tmp/genesys-ollama-install.sh
          sh /tmp/genesys-ollama-install.sh
      - name: Start Ollama and pull only the selected model
        run: |
          ollama serve > /tmp/genesys-ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/api/version >/dev/null && break; sleep 2; done
          ollama pull "$MODEL"
          ollama list
      - name: Runs (v1 evaluation set is historical; development set is for iteration)
        shell: bash
        run: |
          mkdir -p artifacts
          tag=${MODEL//[:.]/-}
          run(){ node scripts/run-genesys-operational-benchmark.cjs --mode=qwen --model="$MODEL" \
            --model-url=http://127.0.0.1:11434 --cases="$1" --intent="$2" \
            --out="artifacts/$tag-$3-$2.json" --failures="artifacts/$tag-$3-$2-failures.jsonl" > /dev/null; }
          run tests/fixtures/genesys-operational-cases-v1.json v1 eval
          run tests/fixtures/genesys-operational-cases-v1.json v2 eval
          run tests/fixtures/genesys-operational-dev-v1.json v1 dev
          run tests/fixtures/genesys-operational-dev-v1.json v2 dev
          if [ -f tests/fixtures/genesys-candidate-freeze.json ]; then
            echo "Candidate freeze present: running the protected holdout once."
            run tests/fixtures/genesys-operational-holdout-v2.json v1 holdout
            run tests/fixtures/genesys-operational-holdout-v2.json v2 holdout
          else
            echo "No candidate freeze committed: holdout NOT run. (holdout-v2 was spent in run 44330800598; see tests/fixtures/genesys-holdout-v2-result.json)"
          fi
      - name: Failures to the Academy remediation queue
        if: always()
        shell: bash
        working-directory: research/aion-v06
        run: |
          for f in ../../artifacts/*-failures.jsonl; do
            [ -s "$f" ] && python -m aion_genesis.gml.operational_intake --failures "$f" --out "${f%-failures.jsonl}-academy-queue.json"
          done
          true
      - name: Publish measured results (evidence, not promotion)
        if: always()
        run: |
          node -e '
          const fs=require("fs"),dir="artifacts";const lines=["## Genesys operational loop — "+process.env.MODEL+" — commit "+process.env.GITHUB_SHA];
          for(const f of fs.readdirSync(dir).filter(f=>f.endsWith(".json")&&!f.includes("academy")).sort()){
           const r=JSON.parse(fs.readFileSync(dir+"/"+f)),s=r.scorecard;
           lines.push("RESULT "+JSON.stringify({file:f,model:s.model&&{id:s.model.id,digest:s.model.digest,quant:s.model.quantization},
            partition:s.partition,intent:s.intentVersion,overall:s.overall.passed+"/"+s.overall.total,
            tasks:s.task_completion_verified_state.passed+"/"+s.task_completion_verified_state.total,
            safe:s.safe_no_write_cases.passed+"/"+s.safe_no_write_cases.total,unsafe:s.unsafe_writes,
            byCategory:Object.fromEntries(Object.entries(s.by_category).map(([k,v])=>[k,v.passed+"/"+v.total])),
            latency:s.latency_ms,tokens:s.tokens,rejected:s.model_output_rejected.length}));
           if(s.partition!=="evaluation-v1")for(const x of r.rows)lines.push("CASE "+JSON.stringify({f,id:x.id,pass:x.pass,classes:x.observedClasses,
            raw:x.rawModelOutput.map(t=>(t||"").slice(0,600)),unexpected:x.unexpectedChanges,missing:x.missingEffects.length}));}
          console.log(lines.join("\n"));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.filter(l=>!l.startsWith("CASE")).join("\n\n")+"\n");'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesys-qwen-${{ strategy.job-index }}-${{ github.run_id }}
          path: artifacts
          retention-days: 30
