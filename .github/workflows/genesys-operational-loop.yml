name: AION Genesys — operational loop (instruction → verified TradeFlow state)

on:
  push:
    branches:
      - claude/genesys-operational-loop-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesys-operational-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, browser, baseline and execution-layer checks (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Genesys operator and affected TradeFlow executor tests
        run: node --test tests/genesys-operator.test.cjs tests/invoice-followup-execution.test.cjs
      - name: Full TradeFlow Node suite (known missing 60-frame orb MP4 is reported, not hidden)
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm test > artifacts/node-suite.log 2>&1
          code=$?
          grep -E "^# (tests|pass|fail)" artifacts/node-suite.log
          failing=$(grep -E "^not ok" artifacts/node-suite.log | grep -v "both real 60-frame media assets must be installed before shipping" || true)
          if [ -n "$failing" ]; then echo "$failing"; exit 1; fi
          echo "Node suite exit code $code; only the known orb-media release blocker may fail."
      - name: Academy intake tests
        working-directory: research/aion-v06
        run: python -m unittest discover -s tests -p test_genesys_operational_intake.py -v
      - name: Browser prerequisites
        run: npx playwright install --with-deps chromium
      - name: Real TradeFlow app in Chromium (IndexedDB, runtime, executor, approval dialog)
        run: node scripts/verify-genesys-operator-browser.cjs
      - name: Baseline (today's TradeFlow) and scripted execution-layer reference (NOT AI)
        run: |
          node scripts/run-genesys-operational-benchmark.cjs --mode=baseline --out=artifacts/genesys-baseline.json --failures=artifacts/genesys-baseline-failures.jsonl
          node scripts/run-genesys-operational-benchmark.cjs --mode=oracle --out=artifacts/genesys-oracle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesys-verify-${{ github.run_id }}
          path: artifacts
          retention-days: 30

  qwen:
    # One bounded CPU run per push on this isolated branch: free hosted runner, public
    # weights, loopback-only model, synthetic records, no secrets, no deployment.
    name: Real Qwen3-0.6B interpretation through the full loop (CPU)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_HOST: 127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install loopback Ollama
        run: |
          curl --fail --silent --show-error --location https://ollama.com/install.sh -o /tmp/genesys-ollama-install.sh
          sh /tmp/genesys-ollama-install.sh
      - name: Start Ollama and pull only qwen3:0.6b
        run: |
          ollama serve > /tmp/genesys-ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/api/version >/dev/null && break; sleep 2; done
          ollama pull qwen3:0.6b
          ollama list
      - name: 24 frozen cases with real model inference
        run: >-
          node scripts/run-genesys-operational-benchmark.cjs --mode=qwen --model=qwen3:0.6b
          --model-url=http://127.0.0.1:11434 --out=artifacts/genesys-qwen.json
          --failures=artifacts/genesys-qwen-failures.jsonl
      - name: Failures to the Academy remediation queue
        if: always()
        working-directory: research/aion-v06
        run: |
          if [ -f ../../artifacts/genesys-qwen-failures.jsonl ]; then
            python -m aion_genesis.gml.operational_intake --failures ../../artifacts/genesys-qwen-failures.jsonl --out ../../artifacts/genesys-academy-queue.json
          fi
      - name: Publish measured result (evidence, not promotion)
        if: always()
        run: |
          node -e '
          const fs=require("fs");const f="artifacts/genesys-qwen.json";
          const lines=["## Genesys operational loop — real Qwen3-0.6B","Synthetic five-person contractor records; owner approval simulated as approve-what-was-proposed. Exact commit: "+process.env.GITHUB_SHA];
          if(fs.existsSync(f)){const r=JSON.parse(fs.readFileSync(f));const s=r.scorecard;
           lines.push("Model: "+JSON.stringify(s.model),"Overall "+s.overall.passed+"/"+s.overall.total,
            "Task completion (verified persisted state) "+s.task_completion_verified_state.passed+"/"+s.task_completion_verified_state.total,
            "Safe no-write cases "+s.safe_no_write_cases.passed+"/"+s.safe_no_write_cases.total,"Unsafe writes "+s.unsafe_writes.count+" "+JSON.stringify(s.unsafe_writes.cases),
            "By category "+JSON.stringify(s.by_category),"Latency ms "+JSON.stringify(s.latency_ms),"Tokens "+JSON.stringify(s.tokens),
            "Failing: "+r.rows.filter(x=>!x.pass).map(x=>x.id+"="+x.observedClasses.join(">")).join(", "));
           console.log(lines.join("\n"));}else lines.push("Qwen run INCOMPLETE");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n\n")+"\n");'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesys-qwen-${{ github.run_id }}
          path: artifacts
          retention-days: 30
