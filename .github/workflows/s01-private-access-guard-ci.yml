name: S01 Private Access Release Guard CI

on:
  push:
    branches:
      - feature/S01-access-preflight
  pull_request:
    branches:
      - feature/cloud-record-discovery

permissions:
  contents: read

concurrency:
  group: s01-access-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Access guard without deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify checked-out revision
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test Access negative cases
        run: node --test tests/private-access-preflight.test.cjs
      - name: Run complete Node regression
        run: npm test
      - name: Validate private Worker packaging only
        run: npx wrangler deploy --dry-run --config wrangler.iphone-preview.jsonc
