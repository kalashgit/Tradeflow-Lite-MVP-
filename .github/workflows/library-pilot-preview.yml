name: TradeFlow Library Pilot Preview
on:
  push:
    branches:
      - feature/library-universal-intake
    paths:
      - ".github/workflows/library-pilot-preview.yml"
      - "public/**"
      - "src/**"
      - "migrations/**"
      - "tests/**"
      - "automation/**"
      - "wrangler.jsonc"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tradeflow-library-pilot-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/feature/library-universal-intake'
    runs-on: ubuntu-latest
    environment: tradeflow-preview
    steps:
      - name: Checkout the actual Library feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and regression checks
        run: |
          node --check public/app.js
          node --check public/suppliers.js
          node --check public/core-integration.js
          node --check public/library.js
          node --check public/document-intake.js
          node --check public/location-quality.js
          node --check public/job-intake-links.js
          node --check public/library-commands.js
          node --check public/voice-command.js
          node --check public/launch-more-commands.js
          node --check public/job-forms.js
          node --check public/change-orders.js
          node --check public/notifications.js
          node --check public/operational-intelligence.js
          node --check public/operations.js
          node --check public/opportunity-dossier.js
          node --check public/revenue.js
          node --check public/calendar.js
          node --check public/flow-wave-art.js
          node --check public/flow-wave-audio.js
          node --check public/sw.js
          node --check src/index.js
          node --check src/tenant-security.js
          node --check src/oidc-verifier.js
          node --check src/tenant-api.js
          node --check src/tenant-record-store.js
          node --check src/offline-conflicts.js
          node --check src/backup-snapshot.js
          node --check src/tenant-export.js
          node --check src/tenant-restore-plan.js
          node --test tests/*.test.cjs
          python3 tests/tenant-migrations.test.py
          node automation/run-ten-pain-points.cjs
      - name: Upload ten-workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradeflow-ten-pain-points
          path: artifacts/ten-pain-points/
          if-no-files-found: warn
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Verify isolation
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(config.name!=='tradeflow-v05-preview'||config.assets?.directory!=='./public')throw Error('Unexpected base configuration');
          for(const item of ['library.js','library.css','document-intake.js','location-quality.js','job-intake-links.js','library-commands.js'])if(!fs.existsSync('public/'+item))throw Error('Missing '+item);
          const d1=config.d1_databases||[];
          if(d1.length!==1||d1[0].binding!=='TF_DB'||d1[0].database_name!=='tradeflow-pilot-isolated')throw Error('Unexpected D1 binding');
          if(config.vars?.TF_BACKUP_EXPORT_ENABLED==='true'||config.vars?.TF_BACKUP_DRY_RUN_ENABLED==='true')throw Error('Backup routes unexpectedly enabled');
          NODE
      - name: Record exact preview source
        run: node automation/preview-release.cjs build
      - name: Deploy separate Library pilot Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.jsonc --name tradeflow-library-pilot-preview
      - name: Verify exact deployed source
        run: node automation/preview-release.cjs verify https://tradeflow-library-pilot-preview.bartoszszarafinski.workers.dev
      - name: Verify preview serves current Library assets
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const root='https://tradeflow-library-pilot-preview.bartoszszarafinski.workers.dev';
          (async()=>{
            for(let i=0;i<10;i++){
              try{
                const res=await fetch(root+'/?fresh='+Date.now(),{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
                const body=await res.text();
                if(res.status===200&&body.includes('document-intake-r01')&&body.includes('location-quality.js')&&body.includes('suppliers.js?v=supplier-r02')&&body.includes('core-integration.js?v=supplier-r02')&&body.includes('launch-more-commands.js?v=command-r01')&&body.includes('revenue.js?v=finance-r02')&&body.includes('app.js?v=finance-r02')&&body.includes('notifications.js?v=finance-r02')){
                  for(const file of ['library.js','document-intake.js','location-quality.js','app.js','notifications.js','revenue.js','operational-intelligence.js','launch-more-commands.js','suppliers.js','core-integration.js']){
                    const asset=await fetch(root+'/'+file+'?fresh='+Date.now(),{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
                    assert.equal(asset.status,200,file);
                    const source=await asset.text();
                    const required={'app.js':'tfReusableQuoteFields','notifications.js':'opportunity.bid_readiness_review','revenue.js':'invoice_manual_followup','operational-intelligence.js':'job.crew_credential_review','launch-more-commands.js':'overdue|unpaid|draft','suppliers.js':'supplierQuoteExpires','core-integration.js':'Supplier price quote has expired.'};
                    if(required[file])assert.ok(source.includes(required[file]),file+' is not the latest optimization build');
                  }
                  const api=await fetch(root+'/api/v1/me',{redirect:'manual',headers:{'Cache-Control':'no-store'},signal:AbortSignal.timeout(15000)});
                  assert.ok([302,303,307,401,403].includes(api.status),'Unauthenticated account API must be denied');
                  console.log('Live assets verified; unauthenticated business API blocked at '+root);return;
                }
              }catch(e){console.log('Verification attempt:',e.message)}
              await new Promise(r=>setTimeout(r,4000));
            }
            throw Error('Library preview did not become available or assets did not match expected version');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
